<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Maintenance – sounddna</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/status.css">
</head>
<body>

  <main class="status status--maintenance">
    <img class="status__logo" src="assets/logo.svg" alt="sounddna">

    <div class="status__body">
      <span class="status__badge"><span class="status__dot"></span>Scheduled maintenance</span>

      <h1 class="status__title">We'll be back shortly</h1>
      <p class="status__sub">We're working on SpotTool right now. Your spots and schedules are safe, nothing is lost.</p>

      <!-- Rückkehrzeit: per URL (?until=16:00) oder hier fest eintragen und "hidden" entfernen -->
      <div class="status__info" id="eta" hidden>
        <span class="status__label">Expected back</span>
        <span class="status__value" id="eta-value"></span>
      </div>
    </div>

    <footer class="status__footer">
      <a href="mailto:office@sound-dna.com">Contact</a>
      <a href="https://sound-dna.com/impressum">Imprint</a>
      <a href="https://sound-dna.com/datenschutz">Privacy Policy</a>
    </footer>
  </main>

  <script>
    const until = new URLSearchParams(location.search).get('until');
    if (until) {
      document.getElementById('eta-value').textContent = until.slice(0, 40);
      document.getElementById('eta').hidden = false;
    }
  </script>
</body>
</html>
