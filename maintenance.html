<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Maintenance – sounddna</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/status.css">
</head>
<body>

  <main class="status">
    <img class="status__logo" src="assets/logo.svg" alt="sounddna">

    <div class="status__body">
      <h1 class="status__title">We'll be back shortly</h1>
      <p class="status__sub">We're working on the Service Portal right now. Your spots and schedules are safe, nothing is lost.</p>

      <!-- Rückkehrzeit: per URL (?until=16:00) oder hier fest eintragen und "hidden" entfernen -->
      <div class="status__info" id="eta" hidden>
        <span class="status__label">Expected back</span>
        <span class="status__value" id="eta-value"></span>
      </div>

      <!-- Ziel kommt aus ?from= (js/status.js); ohne from bleibt der Button aus -->
      <a class="status__action" id="back-btn" href="#" hidden>
        <span>Try reaching the Service Portal</span>
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </a>
      <p class="status__note" id="back-note" role="status" hidden>The Service Portal is still under maintenance.</p>
    </div>
  </main>

  <script src="js/status.js"></script>
</body>
</html>
